name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: 🔐 rigorix-verifier (fmt · clippy · test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Rust workspace lives under rust/ (schemas/ is language-neutral,
    # consumed by engine conformance in rigorix-oss and by the SDK clients).
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (verifier + fixtures + schema lint)
        # Covers: HMAC sign/verify roundtrip, tamper detection, unsigned-must-
        # be-degraded, wrong-key failure, canonical stability, envelope schema
        # conformance, the committed REAL engine fixtures verified byte-exact
        # (schemas/fixtures/envelope/*.json), `all_schemas_compile` (envelope/
        # claims/policy/catalog.schema/errors are valid draft 2020-12 schemas),
        # the native-API `catalog_integrity` check and `error_taxonomy_codes_
        # consistent` (ADR-0001). `rigorix-schemas` embeds the whole schemas/**
        # corpus at build time; its sync test fails if embedded != on-disk.
        run: cargo test --workspace

      - name: Package (`rigorix-schemas` must be self-contained)
        # Verifies the packaged crate builds with its dereferenced schemas/**
        # corpus — no path/env dependency on the repo (SDK-SCHEMAS-PUBLISH).
        run: cargo package -p rigorix-schemas

      - name: Packaged 0.2.0 carries anchor_head (clean-consumer smoke)
        # SDK-CRATES-0.2.0: the packaged `rigorix-schemas` .crate must declare
        # the Phase C `anchor_head` + fixture, and a clean scratch consumer must
        # verify the anchored fixture with RIGORIX_SDK_SCHEMAS unset. `cargo
        # package -p rigorix-verifier` becomes runnable once rigorix-schemas
        # 0.2.0 is on crates.io (publish schemas first).
        run: ./scripts/verify-packaged-crates.sh

      - name: Verifier self-containment (embedded corpus, no override)
        # SDK-VERIFIER-PUBLISH: the verifier resolves contracts from the embedded
        # `rigorix-schemas` corpus (env override unset). `cargo package -p
        # rigorix-verifier` / `cargo publish --dry-run` become runnable once
        # `rigorix-schemas` is on crates.io (publish it first — SDK-SCHEMAS-PUBLISH).
        run: |
          unset RIGORIX_SDK_SCHEMAS
          cargo test -p rigorix-verifier --lib

      - name: rigorix-client has NO rigorix-engine dependency
        # ADR-0001 D-1: execution logic never moves into an SDK. SDK-C4.
        run: |
          if cargo tree -p rigorix-client | grep -q rigorix-engine; then
            echo "rigorix-client must not depend on rigorix-engine"; exit 1
          fi
          echo "no rigorix-engine dependency"

  python-verifier:
    name: 🐍 rigorix-verifier (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[test]"

      - name: Test (Strategy A parity, Python)
        # Byte-exact HMAC against the committed engine fixtures + JSON Schema +
        # ADR-016 chain/checkpoint + Ed25519 anchor verification.
        run: pytest -q

      - name: Pack → install → smoke (wheel + sdist, no RIGORIX_SDK_SCHEMAS)
        # SDK-C6-PACKAGING: the wheel AND sdist must carry a REAL corpus
        # (setuptools does not follow the repo symlink), and the installed
        # package must verify with the env override unset.
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --outdir "$RUNNER_TEMP/pydist"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install "$RUNNER_TEMP"/pydist/*.whl
          unset RIGORIX_SDK_SCHEMAS
          "$RUNNER_TEMP/wheel-venv/bin/python" "$GITHUB_WORKSPACE/python/scripts/pack_smoke.py"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install "$RUNNER_TEMP"/pydist/*.tar.gz
          "$RUNNER_TEMP/sdist-venv/bin/python" "$GITHUB_WORKSPACE/python/scripts/pack_smoke.py"

  typescript-verifier:
    name: 🟦 rigorix-verifier (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install
        run: npm ci

      - name: Test (Strategy A parity, TypeScript)
        # tsc + `node --test`: byte-exact HMAC (lossless numbers), JSON Schema,
        # ADR-016 chain/checkpoint, Ed25519 anchor verification.
        run: npm test

      - name: Pack → install → smoke (no RIGORIX_SDK_SCHEMAS)
        # SDK-C6-PACKAGING: `npm pack` must ship a REAL corpus (npm does not
        # follow the repo symlink), and the installed tarball must verify with
        # the env override unset.
        run: |
          set -euo pipefail
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL=$(ls "$RUNNER_TEMP"/rigorix-verifier-*.tgz | head -1)
          WORK="$RUNNER_TEMP/ts-smoke"
          mkdir -p "$WORK"
          cp scripts/pack-smoke.mjs "$WORK/smoke.mjs"
          cd "$WORK"
          npm init -y >/dev/null
          npm install "$TARBALL" --no-audit --no-fund >/dev/null
          unset RIGORIX_SDK_SCHEMAS
          node smoke.mjs

  typescript-client:
    name: 🟦 rigorix-client (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: typescript-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript-client/package-lock.json

      - name: Install
        run: npm ci

      - name: Test (typed client framing + catalog drift)
        # tsc + `node --test`: JSON-RPC framing (single/batch/notification), error
        # taxonomy, version negotiation, and catalog drift against catalog.json.
        run: npm test
