name: Publish

# SDK-PUBLISH-PY-TS (#33): tag-triggered registry publication for the Python +
# TypeScript verifiers/clients, followed by a clean registry-install smoke.
#
# Auth (configure once, by the release owner):
#   - PyPI: Trusted Publishing (OIDC) for repo `arman-jalili/rigorix-sdk`,
#           workflow `publish.yml` — no secret (uses `id-token: write`).
#   - npm:  `NPM_TOKEN` automation token (repo secret), 2FA bypass.
#   - Publish the shared version first: `python/pyproject.toml`,
#     `typescript/package.json`, `typescript-client/package.json` (+ their
#     lockfiles). Each job asserts the tag matches the artifact version.
#
# Dry run (build only, no upload): Actions → Publish → Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: 🐍 rigorix-verifier → PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Job-level `permissions` REPLACES the workflow-level block, so
      # `contents: read` must be repeated here or `actions/checkout` fails with
      # "Repository not found" (private repo, token has no contents scope).
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Build sdist + wheel (corpus bundled by setup.py)
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist

      - name: Publish to PyPI (Trusted Publishing)
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm-verifier:
    name: 🟦 rigorix-verifier → npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci

      - name: Assert the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$ver"
          test "$tag" = "$ver"

      - run: npm run build

      - name: Publish to npm (prepack re-bundles the corpus)
        if: github.event_name == 'push'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-client:
    name: 🟦 rigorix-client → npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: typescript-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript-client/package-lock.json

      - run: npm ci

      - name: Assert the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$ver"
          test "$tag" = "$ver"

      - name: Publish to npm (prepack builds dist/)
        if: github.event_name == 'push'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke:
    name: 🔎 registry install + anchored-fixture smoke
    needs: [python, npm-verifier, npm-client]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: PyPI install → verify the anchored fixture (no env override)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python -m venv "$RUNNER_TEMP/py"
          # PyPI/CDN propagation can lag after Trusted Publishing. Retry
          # generously: the job has a 20-minute timeout, so a few extra minutes
          # of waiting is far cheaper than a false red on a real release.
          installed=no
          for attempt in {1..12}; do
            if "$RUNNER_TEMP/py/bin/pip" install --quiet "rigorix-verifier==$tag"; then
              installed=yes; break
            fi
            echo "py install attempt $attempt: not yet available; retrying in 20s"
            sleep 20
          done
          test "$installed" = yes || { echo "FAIL: rigorix-verifier==$tag not installable from PyPI"; exit 1; }
          unset RIGORIX_SDK_SCHEMAS
          "$RUNNER_TEMP/py/bin/python" "$GITHUB_WORKSPACE/python/scripts/pack_smoke.py"

      - name: npm install → verify the anchored fixture (no env override)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/npm"
          cp "$GITHUB_WORKSPACE/typescript/scripts/pack-smoke.mjs" "$RUNNER_TEMP/npm/smoke.mjs"
          cd "$RUNNER_TEMP/npm"
          npm init -y >/dev/null
          # npm registry propagation can lag after publish — MEASURED at ~95s on
          # the v0.5.0 release (the npm-client job reported success at 17:31:58 but
          # `rigorix-client@0.5.0` only became installable at 17:33:33). The previous
          # window was 5 x 15s = 75s, which is SHORTER than that lag, so the smoke
          # gate failed on a perfectly good release. Keep a window well above the
          # observed lag: 12 x 20s = 4 minutes.
          installed=no
          for attempt in {1..12}; do
            if npm install "rigorix-verifier@$tag" "rigorix-client@$tag" --no-audit --no-fund; then
              installed=yes; break
            fi
            echo "npm install attempt $attempt: not yet available; retrying in 20s"
            sleep 20
          done
          test "$installed" = yes || { echo "FAIL: rigorix-verifier@$tag / rigorix-client@$tag not installable from npm"; exit 1; }
          unset RIGORIX_SDK_SCHEMAS
          node smoke.mjs
