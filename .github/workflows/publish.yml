name: Publish

# SDK-PUBLISH-PY-TS (#33): tag-triggered registry publication for the Python +
# TypeScript verifiers/clients, followed by a clean registry-install smoke.
#
# Auth (configure once, by the release owner):
#   - PyPI: Trusted Publishing (OIDC) for repo `arman-jalili/rigorix-sdk`,
#           workflow `publish.yml` — no secret (uses `id-token: write`).
#   - npm:  `NPM_TOKEN` automation token (repo secret), 2FA bypass.
#   - Maven Central: namespace `dev.rigorix` (verified on the Central Portal),
#           `MAVEN_CENTRAL_USERNAME` + `MAVEN_CENTRAL_TOKEN` (Portal token),
#           `MAVEN_GPG_PRIVATE_KEY` + `MAVEN_GPG_PASSPHRASE` (signing). The job
#           fails by name when any of them is absent — never silently skips.
#   - Publish the shared version first: `python/pyproject.toml`,
#     `typescript/package.json`, `typescript-client/package.json`,
#     `java/pom.xml` (+ their lockfiles). Each job asserts the tag matches the
#     artifact version.
#   - Go is tag-only: the module lives in `go/`, so its release tag is `go/vX.Y.Z`
#     (a root `vX.Y.Z` tag does not version it). There is nothing to upload;
#     `go get` reads the repo by tag, which requires the repository to be
#     publicly readable.
#
# Dry run (build only, no upload): Actions → Publish → Run workflow.

on:
  push:
    tags: ["v*"]
  # #121: the two post-release checks could not be re-run. A dispatch *skipped* them
  # and would have *run* the uploads, so the fixes a red release found had to be
  # proven blind. A dispatch now runs the checks and nothing else.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (empty = the newest v* tag)"
        required: false
        default: ""
      channels:
        # Empty means "the channels this workflow publishes" — one constant in
        # `scripts/resolve-release.sh`, next to the upload jobs it describes, so the
        # fallback cannot drift from them (#127). crates is `cargo publish` by hand and
        # Go is served by the tag itself, so asking about either is explicit:
        # `-f channels=crates,pypi,npm,maven,go` (a release's definition of done covers
        # all five; the workflow only uploads three).
        description: "Channels to verify, comma-separated (empty = pypi,npm,maven)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # #103: before any upload. Two properties nothing asserted: that the version is
  # new (a registry rejecting it late, after another channel has taken it, is
  # discovered by hand) and that the five manifests are one version. The registry
  # answers come from each coordinate's own metadata, never a composed download URL.
  preflight:
    name: 🔒 release identity (manifests, tag, unpublished everywhere)
    # Push-only. On a dispatch the version is already published, which is exactly the
    # condition this job exists to refuse — running it would make every post-release
    # check unrunnable (#121).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0` is required, not cosmetic: the verdict reads the tag, the
      # commit it peels to, and the manifests *at that commit*. A shallow clone has no
      # refs/tags, so the gate would report "does not exist" for a tag it was pushed on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Can the gate refuse? (published version, wrong tag, split manifests)
        run: bash scripts/check-release.sh --self-test

      # `actions/checkout` fetches the tag's commit *into* refs/tags/<tag> with
      # --no-tags, so in a runner the local ref points at a commit while the remote
      # holds the annotation (#116). Restoring the object is belt and braces for
      # anything else that reads the local ref — the verdict below reads the remote's
      # advertisement and does not depend on this succeeding.
      - name: Restore the annotated tag ref
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -uo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || echo unreadable)"
          echo "refs/tags/${GITHUB_REF_NAME} -> ${type}"
          [ "$type" = tag ] ||
            echo "::warning::the local ref still points at a ${type}; the preflight reads the remote instead"

      - name: Preflight — the version is new and the tag agrees
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/check-release.sh --tag "${{ github.ref_name }}"

      # The document gate ran only *after* the uploads (#125), so the release that made a
      # document false had already published, irreversibly, when the check said so. This
      # is the pre-publish form: no registry is read, because before the upload the
      # registry can only answer with the previous version — it compares the documents
      # with the version this tag names.
      - name: Preflight — every document states the version being released
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -uo pipefail
          version="$(bash scripts/check-release.sh --print-version)"
          echo "the tag names ${GITHUB_REF_NAME}; the manifests say ${version}"
          bash scripts/check-release.sh --verify-docs --expect "$version"

  python:
    name: 🐍 rigorix-verifier → PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    if: github.event_name == 'push'
    permissions:
      # Job-level `permissions` REPLACES the workflow-level block, so
      # `contents: read` must be repeated here or `actions/checkout` fails with
      # "Repository not found" (private repo, token has no contents scope).
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Assert the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Build sdist + wheel (corpus bundled by setup.py)
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist

      # Replayable by construction: a version already on the index is done, not
      # broken. The 0.9.0 replay reached PyPI before Maven and failed with
      # "400 File already exists" — a release reading as broken while the
      # artifact is present.
      - name: Check whether this version is already on PyPI
        id: pypi-exists
        run: |
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          status="$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/rigorix-verifier/${ver}/json")"
          if [ "$status" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "✅ rigorix-verifier ${ver} is already on PyPI — nothing to publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "rigorix-verifier ${ver} is not on PyPI (HTTP ${status}); publishing"
          fi

      - name: Publish to PyPI (Trusted Publishing)
        if: github.event_name == 'push' && steps.pypi-exists.outputs.already != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: python/dist

  npm-verifier:
    name: 🟦 rigorix-verifier → npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci

      - name: Assert the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$ver"
          test "$tag" = "$ver"

      - run: npm run build

      # Replayable by construction: a channel that already carries this version is done,
      # not broken. The verifier reached npm 0.9.0 before PyPI and Maven did, so re-running
      # this step failed on "cannot publish over 0.9.0" — a release reading as broken while
      # the artifact is present.
      - name: Publish to npm (skip when the version already exists)
        if: github.event_name == 'push'
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "✅ $pkg@$ver is already published — nothing to publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-client:
    name: 🟦 rigorix-client → npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: typescript-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript-client/package-lock.json

      - run: npm ci

      # The client is an independent cadence: versioned with the train, published on its own tag.
      # Comparing it to the verifier's `vX.Y.Z` made a verifier release fail on a package that was
      # never meant to move (client 0.8.0 against tag 0.9.0).
      - name: Assert the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: |
          tag="${GITHUB_REF_NAME#client-v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$ver"
          test "$tag" = "$ver"

      # Replayable by construction: a channel that already carries this version is done,
      # not broken. The verifier reached npm 0.9.0 before PyPI and Maven did, so re-running
      # this step failed on "cannot publish over 0.9.0" — a release reading as broken while
      # the artifact is present.
      - name: Publish to npm (skip when the version already exists)
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "✅ $pkg@$ver is already published — nothing to publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  maven:
    name: ☕ rigorix-verifier → Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [preflight]
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"
          # Creates the `central` server entry in settings.xml that the
          # `central-publishing-maven-plugin` in the pom's `release` profile expects.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Assert the tag matches the pom version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "tag=$tag pom=$ver"
          test "$tag" = "$ver"
      - name: Fail loudly when publication credentials are absent
        env:
          HAS_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          HAS_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          HAS_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$HAS_USER" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$HAS_TOKEN" ] || missing="$missing MAVEN_CENTRAL_TOKEN"
          [ -n "$HAS_KEY" ] || missing="$missing MAVEN_GPG_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "❌ Missing publication secrets:$missing"
            echo "   Maven Central needs a verified namespace (eu.rigorix) and a signing key."
            echo "   This job fails rather than skipping: a tag that publishes to some registries"
            echo "   and not others is exactly the drift this job exists to prevent."
            exit 1
          fi
      - name: Deploy with sources, javadoc and signatures
        # setup-java writes `${env.MAVEN_CENTRAL_USERNAME}` / `${env.MAVEN_CENTRAL_TOKEN}`
        # into settings.xml. They MUST be exported here or Maven sends empty
        # credentials and the Portal answers `401 Invalid request` (which looks
        # like a revoked token, but is a missing env var).
        run: mvn -B -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  smoke:
    name: 🔎 registry install + anchored-fixture smoke
    needs: [python, npm-verifier, npm-client, maven]
    # `!cancelled()` rather than a bare event test: the four upload jobs are skipped
    # on a dispatch, and a job whose needs are skipped is skipped too — which is how
    # these checks became unreachable (#121).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-latest
    # Worst case is two propagation windows (15 min each) + setup/install.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # `git describe --tags` needs the tags; a shallow clone has none.
          fetch-depth: 0
      # Which release, and which channels — one definition, in `scripts/resolve-release.sh`
      # (#127). It was two byte-identical copies here, whose three decisions (the tag, the
      # channel fallback, what is printed) could diverge silently; it is a script rather
      # than a composite action so it can be tested outside Actions.
      - name: Resolve the tag and channels
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNELS: ${{ inputs.channels }}
        run: |
          bash scripts/resolve-release.sh \
            --event "$GITHUB_EVENT_NAME" \
            --ref-name "$GITHUB_REF_NAME" \
            --input-tag "$INPUT_TAG" \
            --input-channels "$INPUT_CHANNELS" \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: PyPI install → verify the anchored fixture (no env override)
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag }}
        run: |
          tag="${TAG_NAME#v}"
          python -m venv "$RUNNER_TEMP/py"
          # PyPI/CDN propagation can lag well past publication. Wait up to
          # 15 minutes (45 x 20s). Only "version not visible" errors are
          # retried; a visible-but-broken artifact fails fast. On give-up the
          # helper reports a distinct PROPAGATION TIMEOUT (published, smoke
          # unverified) instead of a generic failure.
          "$GITHUB_WORKSPACE/.github/scripts/wait-for-registry.sh" pypi \
            "$RUNNER_TEMP/py/bin/pip" install --quiet --no-cache-dir "rigorix-verifier==$tag"
          unset RIGORIX_SDK_SCHEMAS
          "$RUNNER_TEMP/py/bin/python" "$GITHUB_WORKSPACE/python/scripts/pack_smoke.py"

      - name: npm install → verify the anchored fixture (no env override)
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag }}
        run: |
          tag="${TAG_NAME#v}"
          mkdir -p "$RUNNER_TEMP/npm"
          cp "$GITHUB_WORKSPACE/typescript/scripts/pack-smoke.mjs" "$RUNNER_TEMP/npm/smoke.mjs"
          cd "$RUNNER_TEMP/npm"
          npm init -y >/dev/null
          # npm propagation lag is measured in minutes (v0.5.0: ~95s), so the
          # window must not sit inside it. Wait up to 15 minutes (45 x 20s).
          # ETARGET/E404 (not visible) retry; anything else means the artifact
          # is visible but broken and fails fast. Give-up is reported as a
          # distinct propagation timeout, not a generic failure. Re-running this
          # job does not re-publish: it only installs.
          # `rigorix-client` is an independent cadence, versioned and published on its
          # own `client-v` tag — so `@$tag` asked npm for a version that will never
          # exist. The replacement was wrong in the other direction: it read the version
          # from the *working tree*, which on a dispatch is a branch, so a check about an
          # old release would install a version npm does not serve, for a reason that has
          # nothing to do with the release under test (#129). Both coordinates now come
          # from the release's own tree, and the step says which.
          # `git -C`, not `git`: this step already `cd`-ed into `$RUNNER_TEMP/npm`, so a
          # bare `git show` ran outside the repository and failed for a reason that had
          # nothing to do with the release. Found by dispatching on a branch whose client
          # version differs from the tag's — the shape #129 was filed about.
          client_json="$(git -C "$GITHUB_WORKSPACE" show "${TAG_NAME}:typescript-client/package.json" 2>&1)" || {
            echo "❌ could not read ${TAG_NAME}:typescript-client/package.json — the release's own tree is the subject:" >&2
            printf '%s\n' "$client_json" >&2
            exit 1
          }
          client_ver="$(printf '%s' "$client_json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')" || {
            echo "❌ ${TAG_NAME}:typescript-client/package.json carries no parseable version — a client coordinate with no version cannot be installed" >&2
            exit 1
          }
          echo "installing rigorix-verifier@$tag from tag ${TAG_NAME}; rigorix-client@${client_ver} from ${TAG_NAME}:typescript-client/package.json"
          if ! "$GITHUB_WORKSPACE/.github/scripts/wait-for-registry.sh" npm \
            npm install "rigorix-verifier@$tag" "rigorix-client@$client_ver" --no-audit --no-fund --prefer-online; then
            echo "❌ npm could not serve rigorix-client@${client_ver}, which is what ${TAG_NAME}:typescript-client/package.json declares — the release and the registry disagree about this coordinate, or the client has not been published at that version" >&2
            exit 1
          fi
          unset RIGORIX_SDK_SCHEMAS
          node smoke.mjs

  verify-published:
    name: 🔎 every channel serves what the README documents
    needs: [python, npm-verifier, npm-client, maven]
    # `!cancelled()` rather than a bare event test: the four upload jobs are skipped
    # on a dispatch, and a job whose needs are skipped is skipped too — which is how
    # these checks became unreachable (#121).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      # Which release, and which channels — one definition, in `scripts/resolve-release.sh`
      # (#127). It was two byte-identical copies here, whose three decisions (the tag, the
      # channel fallback, what is printed) could diverge silently; it is a script rather
      # than a composite action so it can be tested outside Actions.
      - name: Resolve the tag and channels
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNELS: ${{ inputs.channels }}
        run: |
          bash scripts/resolve-release.sh \
            --event "$GITHUB_EVENT_NAME" \
            --ref-name "$GITHUB_REF_NAME" \
            --input-tag "$INPUT_TAG" \
            --input-channels "$INPUT_CHANNELS" \
            --github-output "$GITHUB_OUTPUT"

      # The jobs above upload and stop. That is how 0.9.0 reached PyPI without the
      # `binding/` package and the vendored artifact while every local gate was
      # green: the pack gate builds from the tree it just built. This reads the
      # coordinate instead, and checks the wheel for the surface the README names.
      # Channels this workflow publishes. crates.io is not one of them: the crates are
      # published by hand (`cargo publish`, marker tag `rust-vX`, nothing triggered by
      # it), so a job that waited for 0.10.0 there would wait forever — which is what
      # the first real release did. The omission is printed, not silent.
      - name: Published surface — the channels this run was asked about
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag }}
          CHANNELS_IN: ${{ steps.resolve.outputs.channels }}
        run: |
          # Exit 3 is a *partial* verdict: the channels asked about serve the version and
          # the rest were named with the command that would settle them. A dispatch that
          # narrows the question deliberately — `-f channels=pypi,npm` — is exactly that
          # case, so it is a warning here and not a red run; exit 1 (a channel that does
          # not serve it) still fails.
          rc=0
          out="$(bash scripts/check-release.sh --verify-published --tag "$TAG_NAME" --channels "$CHANNELS_IN" 2>&1)" || rc=$?
          printf '%s\n' "$out"
          case "$rc" in
            0) ;;
            3) echo "::warning::partial verdict — the channels this run was not asked about are named above; pass -f channels=crates,pypi,npm,maven,go to ask about all five" ;;
            *) exit "$rc" ;;
          esac

      # A release's definition of done contained no document, which is how four files
      # came to say 0.9.0 while every channel served 0.10.0 (#119). A stale document
      # is now a red run, not a discovery by a reader.
      # The registry-backed form: the documents agree with what the channels *actually*
      # answered. The preflight asked the other question (`--expect`, tree vs tag) before
      # any byte was uploaded; this one can only be asked afterwards (#125), which is why
      # there are two modes rather than one step that moved.
      - name: Every document states the version its channel serves (registry-backed)
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag }}
        run: bash scripts/check-release.sh --verify-docs

      - name: crates.io is a manual step (recorded, not gated here)
        run: |
          echo "::notice::crates.io is published by hand (rust/RELEASING.md):"
          echo "  cargo publish -p rigorix-schemas && cargo publish -p rigorix-verifier"
          echo "  then: bash scripts/check-release.sh --verify-published --channels crates"
