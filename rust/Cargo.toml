[workspace]
resolver = "2"
members = ["rigorix-client", "rigorix-schemas", "rigorix-verifier"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/arman-jalili/rigorix-sdk"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
