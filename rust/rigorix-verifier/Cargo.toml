[package]
name = "rigorix-verifier"
description = "Protocol-only verifier for Rigorix audit envelopes — HMAC integrity, JSON Schema conformance, per-producer chain + anchor signatures. No rigorix-engine dependency (frozen struct copies per the SDK contract-freeze)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rigorix-verifier"
authors = ["Arman Wolkenstein-Jalili and Rigorix contributors"]
keywords = ["rigorix", "audit", "verifier", "hmac", "jsonschema"]
categories = ["development-tools", "cryptography"]
rust-version = "1.74"
include = ["src/**/*", "README.md"]

[dependencies]
# Data-only: the embedded contract corpus. Preserves D-1 (no rigorix-engine).
rigorix-schemas = { version = "0.5.0", path = "../rigorix-schemas" }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.26"
ed25519-dalek = "2"
thiserror = "2"

[dev-dependencies]
